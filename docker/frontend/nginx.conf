server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support du routage SPA Angular (rafraîchissement direct sur /dashboard, /missions...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy transparent vers le backend Laravel pour les requêtes API et métier
    location ~ ^/(api|drones|missions|alertes|emissions-sonores|audio) {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

